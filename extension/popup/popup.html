<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Teams Live Transcript</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1><img src="../icons/icon-32.png" alt="" width="20" height="20" />Teams Live Transcript</h1>

    <section>
      <h2>This page</h2>
      <p id="status" class="status">Checking the page…</p>
      <div class="buttons">
        <button id="save-pane" class="primary" hidden>Save live transcript (.txt)</button>
        <button id="save-live" class="primary" hidden>Save live captions (.txt)</button>
      </div>
      <p id="result" class="result" hidden></p>
    </section>

    <section>
      <h2>Recorded during meetings</h2>
      <p class="hint">Kept here even after the meeting ends or the tab closes.</p>
      <ul id="sessions"></ul>
    </section>

    <section>
      <button id="diagnose" class="link">Not detecting the transcript? Save a diagnostic file</button>
    </section>

    <script src="../src/parse.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
